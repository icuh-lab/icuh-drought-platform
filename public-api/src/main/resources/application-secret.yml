# AWS S3 Configure
spring:
  config:
    activate:
      on-profile: local | prod
  cloud:
    aws:
      s3:
        bucket: ${PUBLIC_S3_BUCKET_NAME:${S3_BUCKET_NAME}}
      stack:
        auto: false
      region:
        static: ${PUBLIC_AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${PUBLIC_AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY_ID}}
        secret-key: ${PUBLIC_AWS_SECRET_ACCESS_KEY:${AWS_SECRET_ACCESS_KEY}}
