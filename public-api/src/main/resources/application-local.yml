spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${PUBLIC_LOCAL_DB_URL:${LOCAL_DB_URL}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PUBLIC_LOCAL_DB_USERNAME:${LOCAL_DB_USERNAME}}
    password: ${PUBLIC_LOCAL_DB_PASSWORD:${LOCAL_DB_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

cors:
  allowed:
    origins: ${PUBLIC_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}}
