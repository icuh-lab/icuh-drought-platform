# 1. 워크플로우 이름 지정
name: icuh-platform CD flow

# 2. 워크플로우가 시작될 조건 지정
#    CI 워크플로우("CI")가 완료된 후에만 실행한다.
#    => 테스트가 전부 통과(success)해야만 배포가 시작된다.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]

jobs:
  build:

    # 3. 가상머신의 실행 환경 지정
    runs-on: ubuntu-latest
    # CI가 success로 끝났고, 그 CI를 트리거한 이벤트가 main 브랜치 push일 때만 배포한다.
    # (PR로 돈 CI는 event가 pull_request라 배포되지 않는다.)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read

    steps:
      # 4. CI가 통과시킨 바로 그 커밋을 체크아웃한다(workflow_run은 기본적으로 기본 브랜치 최신을 받으므로 명시 고정).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 테스트는 선행 CI 워크플로우에서 이미 전부 통과했으므로 여기서는 빌드만 수행한다.
      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Login into Docker Hub
        env:
          DOCKER_HUB_REGISTRY: ${{ secrets.DOCKER_HUB_REPO }}
          DOCKER_HUB_ID: ${{ secrets.DOCKER_HUB_ID }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: echo $DOCKER_HUB_PASSWORD | docker login -u $DOCKER_HUB_ID --password-stdin

      - name: docker build
        run: docker build -t ${{ secrets.DOCKER_HUB_ID }}/${{ secrets.DOCKER_HUB_REPO }}:latest .

      - name: docker push
        run: docker push ${{ secrets.DOCKER_HUB_ID }}/${{ secrets.DOCKER_HUB_REPO }}:latest

      - name: Get Github Actions IP
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Add Github Actions IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Test EC2 SSH Connection
        id: test_ssh_connection
        env:
          SSH_KEY: ${{ secrets.SSH_EC2_KEY }}
          SSH_USER: ${{ secrets.SSH_EC2_USER }}
          SSH_HOST: ${{ secrets.SSH_EC2_HOST }}
        run: |
          echo "$SSH_KEY" > actual-drought-platform-key.pem
          chmod 400 actual-drought-platform-key.pem
          
          ssh -i "actual-drought-platform-key.pem" -o StrictHostKeyChecking=no ${{secrets.SSH_EC2_USER}}@${{secrets.SSH_EC2_HOST}} << EOF
          echo "hello world"
          EOF

      - name: Failed Test EC2 SSH Connection
        if: ${{ failure() }}
        run: aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy to EC2
        run: |
          ssh -i "actual-drought-platform-key.pem" -o StrictHostKeyChecking=no ${{secrets.SSH_EC2_USER}}@${{secrets.SSH_EC2_HOST}} << EOF
            docker login -u ${{ secrets.DOCKER_HUB_ID }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
            docker pull ${{ secrets.DOCKER_HUB_ID }}/${{ secrets.DOCKER_HUB_REPO }}:latest
            docker stop icuh_platform_api
            docker rm icuh_platform_api
            docker run -d --name icuh_platform_api -p 8080:8080 ${{ secrets.DOCKER_HUB_ID }}/${{ secrets.DOCKER_HUB_REPO }}:latest
          EOF

      - name: Remove Github Actions IP From Security Group
        run: |
          aws ec2 revoke-security-group-ingress --group-id ${{ secrets.AWS_SG_ID }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32
