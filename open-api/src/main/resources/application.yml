server:
  port: ${OPEN_API_SERVER_PORT:8083}

spring:
  application:
    name: icuh-drought-open-api
  profiles:
    default: dev
  datasource:
    # 자격증명은 환경변수로 주입한다(DB_URL/DB_USERNAME/DB_PASSWORD). 저장소에 평문 보관 금지.
    url: ${OPEN_API_DB_URL:${DB_URL}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${OPEN_API_DB_USERNAME:${DB_USERNAME}}
    password: ${OPEN_API_DB_PASSWORD:${DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

cors:
  allowed:
    origins: ${OPEN_API_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# 환경별 설정은 application-dev.yml / application-prod.yml 참고
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
