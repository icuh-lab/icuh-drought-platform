pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'icuh-drought-platform'

include(
        'common',
        'core-domain',
        'core-persistence',
        'core-application',
        'public-api',
        'admin-api',
        'open-api',
        'batch'
)
